<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker — Admin</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">💰</span>
      <span class="brand-name">Expense Tracker</span>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" data-view="dashboard"  href="#dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </a>
      <a class="nav-item" data-view="accounts"   href="#accounts">
        <span class="nav-icon">🏦</span> Accounts
      </a>
      <a class="nav-item" data-view="sections"   href="#sections">
        <span class="nav-icon">📁</span> Sections
      </a>
      <a class="nav-item" data-view="categories" href="#categories">
        <span class="nav-icon">🏷️</span> Categories
      </a>
      <a class="nav-item" data-view="expenses"   href="#expenses">
        <span class="nav-icon">📋</span> Expenses
      </a>
    </nav>
    <div class="sidebar-footer">
      <span class="api-badge">API v1 · Port 8080</span>
    </div>
  </aside>

  <!-- Main -->
  <div class="layout">
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h1 class="topbar-title" id="topbarTitle">Dashboard</h1>
      <div class="topbar-actions" id="topbarActions"></div>
    </header>

    <main class="content" id="content">
      <div class="loading-state">
        <div class="spinner"></div>
        <p>Loading…</p>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <dialog id="modal">
    <div class="modal-header">
      <h2 id="modal-title">Modal</h2>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-ghost"    id="modalCancel">Cancel</button>
      <button class="btn-primary"  id="modalSave">Save</button>
    </div>
  </dialog>

  <!-- Toast container -->
  <div id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
